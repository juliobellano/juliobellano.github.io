<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Julio's Doc - Google Docs Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        background-color: #F9FBFD;
        overflow: hidden; /* App handles scrolling */
      }
      /* Custom Scrollbar to match Google Docs */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #dadce0;
        border: 4px solid transparent;
        background-clip: content-box;
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #bdc1c6;
        border: 4px solid transparent;
        background-clip: content-box;
      }
      .cursor-blink {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      /* Google Docs Selection Style */
      ::selection {
        background: #cce0ff; /* Light blue selection */
        color: black;
      }
    </style>
  <script>
    // GitHub Pages SPA: restore path from query string redirect
    (function() {
      var p = new URLSearchParams(window.location.search).get('p');
      if (p) {
        var q = new URLSearchParams(window.location.search).get('q');
        var url = '/' + decodeURIComponent(p) + (q ? '?' + decodeURIComponent(q) : '') + window.location.hash;
        window.history.replaceState(null, '', url);
      }
    })();
  </script>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
